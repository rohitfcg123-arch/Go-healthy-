function load(){try{var s=JSON.parse(localStorage.getItem(KEY)||'null');return Object.assign({},defaults,s||{});}catch(e){return Object.assign({},defaults);}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){showToast('Could not save on this device / इस डिवाइस पर सेव नहीं हुआ');}}
function t(k){var lang=state.lang||'en';return (texts[lang]&&texts[lang][k])||texts.en[k]||k;}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(v){return '₹'+Math.round(Number(v)||0).toLocaleString('en-IN');}
function nowLocalValue(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16);}
function fmtDate(s,opts){var d=new Date(s);if(isNaN(d))return '—';return d.toLocaleDateString(state.lang==='hi'?'hi-IN':'en-IN',opts||{day:'numeric',month:'short'});}
function fmtTime(s){var d=new Date(s);return isNaN(d)?'':d.toLocaleTimeString(state.lang==='hi'?'hi-IN':'en-IN',{hour:'numeric',minute:'2-digit'});}
function sortedLogs(){return state.logs.slice().sort(function(a,b){return new Date(b.at)-new Date(a.at);});}
function dayKey(d){var x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}
function dayLogs(d){var k=dayKey(d);return state.logs.filter(function(l){return dayKey(l.at)===k;});}
function daysSince(start,end){return Math.max(0,(new Date(end||Date.now())-new Date(start||Date.now()))/86400000);}
function lastSmoke(){var a=sortedLogs();return a.length?a[0].at:(state.startedAt||new Date().toISOString());}
function timeParts(){var ms=Math.max(0,Date.now()-new Date(lastSmoke()).getTime());var d=Math.floor(ms/86400000),h=Math.floor(ms%86400000/3600000),m=Math.floor(ms%3600000/60000);return {d:d,h:h,m:m};}
function smokeAvoided(){var ds=daysSince(state.startedAt||new Date().toISOString());return Math.max(0,Math.floor(ds*(Number(state.usual)||0)-state.logs.length));}
function savedMoney(){return smokeAvoided()*(Number(state.price)||0);}
function periodLogs(n){var start=Date.now()-n*86400000;return state.logs.filter(function(l){return new Date(l.at).getTime()>=start;});}
function avgDaily(n){return periodLogs(n).length/Math.max(1,n);}
function trGoal(){return state.goal==='quit'?t('goalQuit'):state.goal==='reduce'?t('goalReduce'):t('goalTrack');}
function render(){if(!state.lang||!state.setupComplete){renderSetup();return;}app.innerHTML=header()+body()+nav();bindEvents();}

function makeDays(n){var result=[];for(var i=n-1;i>=0;i--){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);result.push({date:d,key:dayKey(d),label:d.toLocaleDateString(state.lang==='hi'?'hi-IN':'en-IN',{day:'numeric',month:'short'}),short:d.toLocaleDateString(state.lang==='hi'?'hi-IN':'en-IN',{day:'numeric'}),value:dayLogs(d).length,money:dayLogs(d).reduce(function(s,l){return s+Number(l.price||0);},0)});}return result;}

else if(statsTab==='overview'){html+='<div class="metric-grid"><div class="metric"><div class="metric-head">'+t('total')+' <span>🚬</span></div><div class="metric-number">'+list.length+'</div><div class="metric-foot">'+t(range===7?'last7':'last30')+'</div></div><div class="metric"><div class="metric-head">'+t('spentTotal')+' <span>👛</span></div><div class="metric-number">'+money(total)+'</div><div class="metric-foot">'+t(range===7?'last7':'last30')+'</div></div><div class="metric"><div class="metric-head">'+t('avgDay')+' <span>📈</span></div><div class="metric-number">'+average+'</div><div class="metric-foot">'+t('dailyAvg')+'</div></div><div class="metric"><div class="metric-head">'+t('longest')+' <span>🏆</span></div><div class="metric-number">'+timeParts().d+' '+t('days')+'</div><div class="metric-foot">'+t('sinceTracking')+'</div></div></div><div class="card"><h3>'+t('frequency')+'</h3><p>'+t('reduced')+'</p><div class="chart">'+days.slice(-7).map(function(b){return barHtml(b,Math.max(1,...days.slice(-7).map(function(q){return q.value;})),false);}).join('')+'</div></div><div class="card"><h3>'+t('allLogs')+'</h3>'+historyRows(list.slice(0,5))+'</div>';}
else if(statsTab==='frequency'){html+='<div class="card"><h3>'+t('frequency')+'</h3><p>'+t('mostTime')+'</p><div class="chart">'+days.slice(-7).map(function(b){return barHtml(b,Math.max(1,...days.slice(-7).map(function(q){return q.value;})),false);}).join('')+'</div><div class="statline"><span>'+t('total')+'</span><strong>'+list.length+'</strong></div><div class="statline"><span>'+t('avgDay')+'</span><strong>'+average+'</strong></div><div class="statline"><span>'+t('mostTime')+'</span><strong>'+esc(mostCommonTime(list))+'</strong></div></div><div class="card"><h3>'+t('allLogs')+'</h3>'+historyRows(list)+'</div>';}
else if(statsTab==='money'){html+='<div class="metric-grid"><div class="metric"><div class="metric-head">'+t('moneySpent')+' <span>💸</span></div><div class="metric-number">'+money(total)+'</div><div class="metric-foot">'+t(range===7?'last7':'last30')+'</div></div><div class="metric"><div class="metric-head">'+t('costSaved')+' <span>🐷</span></div><div class="metric-number">'+money(savedMoney())+'</div><div class="metric-foot">'+t('fromYourGoal')+'</div></div></div><div class="card"><h3>'+t('spentTotal')+'</h3><p>'+t('moneySpent')+'</p><div class="chart">'+days.slice(-7).map(function(b){return barHtml(b,Math.max(1,...days.slice(-7).map(function(q){return q.money;})),true);}).join('')+'</div><div class="statline"><span>'+t('todaySpent')+'</span><strong>'+money(dayLogs(new Date()).reduce(function(s,l){return s+Number(l.price||0);},0))+'</strong></div><div class="statline"><span>'+t('defaultPriceSet')+'</span><strong>'+money(state.price)+'</strong></div></div><div class="tip-banner"><div class="tip-icon">🐷</div><div><strong>'+t('ifQuit')+'</strong><p>'+t('costSaved')+': <b>'+money(savedMoney())+'</b></p></div></div>';}
else{var reasons=countValues(list,'reason'),locations=countValues(list,'location'),reasonEntries=Object.entries(reasons).sort(function(a,b){return b[1]-a[1];}),locEntries=Object.entries(locations).sort(function(a,b){return b[1]-a[1];});var colors=['#18aa6b','#f0a844','#5f8bed','#ef7166','#a78bdb','#6bbac0'];var sum=reasonEntries.reduce(function(s,a){return s+a[1];},0)||1,deg=0,stops=[];reasonEntries.forEach(function(a,i){var next=deg+a[1]/sum*360;stops.push(colors[i%colors.length]+' '+deg+'deg '+next+'deg');deg=next;});html+='<div class="card"><h3>'+t('byReason')+'</h3><p>'+t('triggers')+'</p>';if(reasonEntries.length){html+='<div class="ring-wrap"><div class="ring" style="background:conic-gradient('+stops.join(',')+')"><div class="ring-center"><strong>'+list.length+'</strong><small>'+t('records')+'</small></div></div><div class="legend">'+reasonEntries.map(function(a,i){return '<div class="legend-row"><span class="legend-dot" style="background:'+colors[i%colors.length]+'"></span><span>'+esc(reasonLabel(a[0]))+'</span><strong>'+Math.round(a[1]/sum*100)+'%</strong></div>';}).join('')+'</div></div>';}else{html+='<div class="empty">'+t('noStats')+'</div>';}html+='</div><div class="card"><h3>'+t('topPlaces')+'</h3><div class="barlist">'+locEntries.map(function(a){return '<div class="barlistrow"><span>'+esc(locationLabel(a[0]))+'</span><div class="track"><span style="width:'+Math.round(a[1]/Math.max(1,list.length)*100)+'%"></span></div><strong>'+a[1]+'</strong></div>';}).join('')+'</div></div><div class="card"><h3>'+t('allLogs')+'</h3>'+historyRows(list.slice(0,10))+'</div>';}
html+='<p class="footnote">'+t('privacyText')+'</p></main>';return html;}
function countValues(list,key){var o={};list.forEach(function(l){var k=l[key]||'other';o[k]=(o[k]||0)+1;});return o;}
function commonValue(list,key){var c=countValues(list,key),best=null;Object.keys(c).forEach(function(k){if(best===null||c[k]>c[best])best=k;});return best;}
function reasonLabel(v){var map={stress:'stress',boredom:'boredom',afterMeal:'afterMeal',social:'social',craving:'craving',other:'other'};return t(map[v]||'other');}
function locationLabel(v){var map={home:'homeLoc',work:'work',friends:'friends',other:'other'};return t(map[v]||'other');}
function mostCommonTime(list){var counts={'6 AM – 12 PM':0,'12 PM – 6 PM':0,'6 PM – 12 AM':0,'12 AM – 6 AM':0};list.forEach(function(l){var h=new Date(l.at).getHours();var key=h<6?'12 AM – 6 AM':h<12?'6 AM – 12 PM':h<18?'12 PM – 6 PM':'6 PM – 12 AM';counts[key]++;});return Object.keys(counts).sort(function(a,b){return counts[b]-counts[a];})[0];}
function historyRows(list){if(!list.length)return '<div class="empty">'+t('noLogs')+'</div>';return list.map(function(l){return '<div class="history-row"><div class="history-icon">🚬</div><div class="history-main"><strong>'+esc(fmtDate(l.at,{day:'numeric',month:'short',year:'numeric'}))+' · '+esc(fmtTime(l.at))+'</strong><small>'+esc(locationLabel(l.location))+' · '+esc(reasonLabel(l.reason))+'</small></div><div class="history-price">'+money(l.price)+'</div><button class="small-delete" data-delete="'+esc(l.id)+'" aria-label="'+t('delete')+'">'+t('delete')+'</button></div>';}).join('');}
function screenTips(){var elapsed=cravingActive?Math.max(0,300-Math.floor((Date.now()-breathStart)/1000)):300;return '<main class="content"><p class="hello">'+t('tipsSub')+'</p><h1 class="page-title">'+t('tipsTitle')+'</h1><div class="card" style="text-align:center;background:linear-gradient(150deg,#e1faeb,#fff);border-color:#d7f3e2"><div class="tip-icon" style="margin:0 auto">🌊</div><h3 style="margin-top:12px">'+t('urgeTitle')+'</h3><p>'+t('urgeText')+'</p>'+(cravingActive?'<div class="breath-circle"><div><span id="urgeTimer">'+Math.floor(elapsed/60)+':'+String(elapsed%60).padStart(2,'0')+'</span><small>'+t('pauseRunning')+'</small></div></div>':'')+'<button class="action-main fullbtn" data-action="'+(cravingActive?'finishCraving':'startCraving')+'">'+(cravingActive?t('done'):t('start5'))+'</button></div><div class="card" style="text-align:center"><h3>'+t('breathTitle')+'</h3><p>'+t('breathText')+'</p><div class="breath-circle" id="breathCircle"><div>'+t('inhale')+'<small>4 seconds</small></div></div><button class="action-secondary" data-action="breathe">'+t('breathTitle')+'</button></div><div class="section-head"><h2>'+t('tipsTitle2')+'</h2></div>'+[['🌤️','tip1','tip1d'],['👐','tip2','tip2d'],['🍵','tip3','tip3d'],['💬','tip4','tip4d']].map(function(a){return '<div class="tip-card"><div class="tip-icon">'+a[0]+'</div><h3>'+t(a[1])+'</h3><p>'+t(a[2])+'</p></div>';}).join('')+'<p class="footnote">'+t('freeTrial')+'<br>Persistent, severe withdrawal or mood symptoms are a good reason to speak with a healthcare professional.</p></main>';}
function screenProfile(){return '<main class="content"><p class="hello">'+t('profileSub')+'</p><h1 class="page-title">'+t('profileTitle')+'</h1><div class="card"><div class="settings-row"><div class="settings-icon">🌐</div><div class="settings-copy"><strong>'+t('language')+'</strong><small>'+(state.lang==='hi'?'हिंदी':'English')+'</small></div><select class="select" id="settingLang" style="width:auto;max-width:115px;padding:9px"><option value="hi" '+(state.lang==='hi'?'selected':'')+'>हिंदी</option><option value="en" '+(state.lang==='en'?'selected':'')+'>English</option></select></div><div class="settings-row"><div class="settings-icon">🚬</div><div class="settings-copy"><strong>'+t('defaultPriceSet')+'</strong><small>'+t('priceSub')+'</small></div><input id="settingPrice" class="input" type="number" min="0" step=".5" value="'+esc(state.price)+'" style="width:90px;padding:10px"></div><div class="settings-row"><div class="settings-icon">📊</div><div class="settings-copy"><strong>'+t('usualSet')+'</strong><small>'+t('reduced')+'</small></div><input id="settingUsual" class="input" type="number" min="0" max="100" value="'+esc(state.usual)+'" style="width:78px;padding:10px"></div><div class="settings-row"><div class="settings-icon">🎯</div><div class="settings-copy"><strong>'+t('dailyGoal')+'</strong><small>'+esc(trGoal())+'</small></div><select class="select" id="settingGoal" style="width:auto;max-width:135px;padding:9px"><option value="quit" '+(state.goal==='quit'?'selected':'')+'>'+t('goalQuit')+'</option><option value="reduce" '+(state.goal==='reduce'?'selected':'')+'>'+t('goalReduce')+'</option><option value="track" '+(state.goal==='track'?'selected':'')+'>'+t('goalTrack')+'</option></select></div><div class="settings-row"><div class="settings-icon">🔔</div><div class="settings-copy"><strong>'+t('reminders')+'</strong><small>'+t('remindersSub')+'</small></div><input type="checkbox" class="switch" id="settingReminders" '+(state.reminders?'checked':'')+'></div><button class="action-main fullbtn" data-action="saveSettings">'+t('saveSettings')+'</button></div><div class="card"><h3>'+t('dataTitle')+'</h3><p>'+t('dataSub')+'</p><button class="action-secondary fullbtn" data-action="export">'+t('export')+'</button><p style="margin-top:12px">'+t('privacyText')+'</p></div><div class="card"><h3 class="danger">'+t('deleteAll')+'</h3><p>'+t('privacyText')+'</p><button class="danger-btn fullbtn" data-action="deleteAll">'+t('deleteAll')+'</button></div><p class="footnote">Go Healthy · '+t('tagline')+'<br>Tracking tool only. It does not replace professional medical advice.</p></main>';}
function renderSetup(){var s=state.onboardingStep||1,lang=state.lang||'en';var html='<main class="content" style="padding-top:25px">';if(s===1){html+='<div class="setup-hero"><div class="setup-logo">🌿</div><h1>Go Healthy</h1><p>'+t('tagline')+'</p><div style="font-size:54px;margin-top:12px">🌱 🚭 🌱</div></div><div class="setup-card"><h2 style="font-size:20px;margin:0 0 5px">'+t('chooseLang')+'</h2><p class="muted" style="font-size:12px;margin:0 0 16px">'+t('langSub')+'</p><button class="language-option '+(state.lang==='hi'?'selected':'')+'" data-lang="hi"><span class="flag">🇮🇳</span><span class="choice-copy"><strong>हिंदी</strong><small>पूरा ऐप हिंदी में</small></span><span class="radio-dot"></span></button><button class="language-option '+(state.lang==='en'?'selected':'')+'" data-lang="en"><span class="flag">🇬🇧</span><span class="choice-copy"><strong>English</strong><small>Full app in English</small></span><span class="radio-dot"></span></button><button class="action-main fullbtn" data-action="setupNext" '+(!state.lang?'disabled style="opacity:.5"':'')+'>'+t('continue')+' →</button></div>';}
else if(s===2){html+='<div class="top-inline"><button class="topback" data-action="setupBack">‹</button><strong>'+t('personalize')+'</strong></div><div class="setup-progress"><span style="width:50%"></span></div><div class="setup-card"><h2 style="margin:0 0 8px;font-size:21px">'+t('personalize')+'</h2><p class="muted" style="font-size:12px">'+t('personalizeSub')+'</p><div class="field"><label>'+t('usual')+'</label><p class="hint">'+t('usualSub')+'</p><div class="stepper"><button data-action="minus">−</button><strong>'+state.usual+'</strong><button data-action="plus">＋</button></div></div><div class="field"><label for="setupPrice">'+t('defaultPrice')+'</label><input class="input" id="setupPrice" type="number" step=".5" min="0" value="'+esc(state.price)+'"><p class="hint">'+t('priceSub')+'</p></div><button class="action-main fullbtn" data-action="setupNext">'+t('next')+' →</button></div>';}
else{html+='<div class="top-inline"><button class="topback" data-action="setupBack">‹</button><strong>'+t('goalTitle')+'</strong></div><div class="setup-progress"><span style="width:100%"></span></div><div class="setup-card"><h2 style="margin:0 0 5px;font-size:21px">'+t('goalTitle')+'</h2><p class="muted" style="font-size:12px">'+t('goalSub')+'</p>'+[['quit','🌱','goalQuit','goalQuitDesc'],['reduce','📉','goalReduce','goalReduceDesc'],['track','📊','goalTrack','goalTrackDesc']].map(function(g){return '<button class="goal-option '+(state.goal===g[0]?'selected':'')+'" data-goal="'+g[0]+'"><span class="flag">'+g[1]+'</span><span class="choice-copy"><strong>'+t(g[2])+'</strong><small>'+t(g[3])+'</small></span><span class="radio-dot"></span></button>';}).join('')+'<button class="action-main fullbtn" data-action="finishSetup">'+t('finish')+' →</button></div>';}
html+='</main>';app.innerHTML=html;bindEvents();}
function showToast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(function(){el.classList.remove('show');},2400);}
function go(p){page=p;if(p==='add'){formData={at:nowLocalValue(),price:state.price,location:'home',reason:'craving'};}render();window.scrollTo(0,0);}
function bindEvents(){app.querySelectorAll('[data-page]').forEach(function(b){b.addEventListener('click',function(){go(b.getAttribute('data-page'));});});app.querySelectorAll('[data-action]').forEach(function(b){b.addEventListener('click',function(){action(b.getAttribute('data-action'));});});app.querySelectorAll('[data-lang]').forEach(function(b){b.addEventListener('click',function(){state.lang=b.getAttribute('data-lang');persist();renderSetup();});});app.querySelectorAll('[data-goal]').forEach(function(b){b.addEventListener('click',function(){state.goal=b.getAttribute('data-goal');persist();renderSetup();});});app.querySelectorAll('[data-choice]').forEach(function(b){b.addEventListener('click',function(){formData[b.getAttribute('data-choice')]=b.getAttribute('data-value');render();});});app.querySelectorAll('[data-statstab]').forEach(function(b){b.addEventListener('click',function(){statsTab=b.getAttribute('data-statstab');render();});});app.querySelectorAll('[data-range]').forEach(function(b){b.addEventListener('click',function(){range=Number(b.getAttribute('data-range'));render();});});app.querySelectorAll('[data-delete]').forEach(function(b){b.addEventListener('click',function(){if(confirm(t('deleteConfirm'))){state.logs=state.logs.filter(function(l){return l.id!==b.getAttribute('data-delete');});persist();render();}});});var frm=document.getElementById('smokeForm');if(frm)frm.addEventListener('submit',saveSmoke);var langSelect=document.getElementById('settingLang');if(langSelect)langSelect.addEventListener('change',function(){state.lang=langSelect.value;persist();render();});}
function action(a){if(a==='home')return go('home');if(a==='stats')return go('stats');if(a==='tips')return go('tips');if(a==='profile')return go('profile');if(a==='add')return go('add');if(a==='backHome')return go('home');if(a==='setupNext'){if(state.onboardingStep===1){if(!state.lang){state.lang='en';}state.onboardingStep=2;}else if(state.onboardingStep===2){var el=document.getElementById('setupPrice');if(el&&Number(el.value)>=0)state.price=Number(el.value);state.onboardingStep=3;}persist();renderSetup();return;}if(a==='setupBack'){state.onboardingStep=Math.max(1,(state.onboardingStep||1)-1);persist();renderSetup();return;}if(a==='minus'){state.usual=Math.max(0,Number(state.usual)-1);persist();renderSetup();return;}if(a==='plus'){state.usual=Math.min(100,Number(state.usual)+1);persist();renderSetup();return;}if(a==='finishSetup'){state.setupComplete=true;if(!state.startedAt)state.startedAt=new Date().toISOString();persist();page='home';render();return;}if(a==='saveSettings'){var p=document.getElementById('settingPrice'),u=document.getElementById('settingUsual'),g=document.getElementById('settingGoal'),r=document.getElementById('settingReminders');if(p&&p.value!==''&&Number(p.value)>=0)state.price=Number(p.value);if(u&&u.value!==''&&Number(u.value)>=0)state.usual=Number(u.value);if(g)state.goal=g.value;if(r)state.reminders=r.checked;persist();render();showToast(t('settingsSaved'));return;}if(a==='export')return exportCsv();if(a==='deleteAll'){if(confirm(t('deleteConfirm')+'\n'+t('deleteAll')+'?')){localStorage.removeItem(KEY);state=Object.assign({},defaults);page='home';render();showToast(t('dataDeleted'));}return;}if(a==='startCraving'){cravingActive=true;breathStart=Date.now();render();return;}if(a==='finishCraving'){cravingActive=false;render();showToast(t('done')+' 🌿');return;}if(a==='breathe'){var el=document.getElementById('breathCircle');if(el){el.innerHTML='<div>'+t('exhale')+'<small>6 seconds</small></div>';setTimeout(function(){if(document.getElementById('breathCircle')){document.getElementById('breathCircle').innerHTML='<div>'+t('inhale')+'<small>4 seconds</small></div>'; }},6000);}return;}}
function saveSmoke(e){e.preventDefault();var at=document.getElementById('logDate').value,price=Number(document.getElementById('logPrice').value);if(!at||!isFinite(price)||price<0){showToast(t('required'));return;}var d=new Date(at);if(isNaN(d)||d.getTime()>Date.now()+60000){showToast(t('required'));return;}state.logs.push({id:String(Date.now())+'-'+Math.random().toString(36).slice(2,8),at:d.toISOString(),price:price,location:formData.location||'home',reason:formData.reason||'craving'});state.logs.sort(function(a,b){return new Date(a.at)-new Date(b.at);});persist();formData={};page='home';render();showToast(t('savedLog'));window.scrollTo(0,0);}
function exportCsv(){var rows=[['date_time','price','location','reason']];sortedLogs().forEach(function(l){rows.push([new Date(l.at).toISOString(),l.price,l.location,l.reason]);});var csv=rows.map(function(row){return row.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(',');}).join('\r\n');var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='go-healthy-records.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);showToast(t('dataExported'));}
window.addEventListener('storage',function(){state=load();render();});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&page==='tips'&&cravingActive)render();});
render();
})();
