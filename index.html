function load(){try{var s=JSON.parse(localStorage.getItem(KEY)||'null');return Object.assign({},defaults,s||{});}catch(e){return Object.assign({},defaults);}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){showToast('Could not save on this device / इस डिवाइस पर सेव नहीं हुआ');}if(window.goHealthyCloud&&window.goHealthyCloud.user){window.goHealthyCloud.sync(state).catch(function(e){console.warn('Cloud backup pending',e);});}}

function commonSmokingHour(){var counts={};state.logs.forEach(function(l){var h=new Date(l.at).getHours();counts[h]=(counts[h]||0)+1;});var keys=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a];});return keys.length?Number(keys[0]):17;}
function commonSmokingTimeLabel(){var h=commonSmokingHour();return (h%12||12)+':00 '+(h>=12?'PM':'AM');}
function t(k){var lang=state.lang||'en';return (texts[lang]&&texts[lang][k])||texts.en[k]||k;}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(v){return '₹'+Math.round(Number(v)||0).toLocaleString('en-IN');}
function nowLocalValue(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16);}
function fmtDate(s,opts){var d=new Date(s);if(isNaN(d))return '—';return d.toLocaleDateString(state.lang==='hi'?'hi-IN':'en-IN',opts||{day:'numeric',month:'short'});}
function fmtTime(s){var d=new Date(s);return isNaN(d)?'':d.toLocaleTimeString(state.lang==='hi'?'hi-IN':'en-IN',{hour:'numeric',minute:'2-digit'});}
function sortedLogs(){return state.logs.slice().sort(function(a,b){return new Date(b.at)-new Date(a.at);});}
function dayKey(d){var x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}
function dayLogs(d){var k=dayKey(d);return state.logs.filter(function(l){return dayKey(l.at)===k;});}
function daysSince(start,end){return Math.max(0,(new Date(end||Date.now())-new Date(start||Date.now()))/86400000);}
function lastSmoke(){var a=sortedLogs();return a.length?a[0].at:(state.startedAt||new Date().toISOString());}
function timeParts(){var ms=Math.max(0,Date.now()-new Date(lastSmoke()).getTime());var d=Math.floor(ms/86400000),h=Math.floor(ms%86400000/3600000),m=Math.floor(ms%3600000/60000);return {d:d,h:h,m:m};}
function smokeAvoided(){var ds=daysSince(state.startedAt||new Date().toISOString());return Math.max(0,Math.floor(ds*(Number(state.usual)||0)-state.logs.length));}
function savedMoney(){return smokeAvoided()*(Number(state.price)||0);}
function periodLogs(n){var start=Date.now()-n*86400000;return state.logs.filter(function(l){return new Date(l.at).getTime()>=start;});}
function avgDaily(n){return periodLogs(n).length/Math.max(1,n);}

function resumeEscapeRun(){if(escape.over)return;escape.running=true;escape.last=performance.now();document.getElementById('escapeOverlay').classList.add('hidden');escape.raf=requestAnimationFrame(escapeFrame);}
function moveEscape(d){if(escape.running)escape.lane=Math.max(0,Math.min(2,escape.lane+d));}
function escapeJump(){if(escape.running&&escape.jump===0){escape.vy=-440;escape.jump=1;}}
function escapeSlide(){if(escape.running)escape.slide=.65;}
function spawnEscapeItem(){var types=['cig','smoke','infected','lung','barrier','cig','smoke'];escape.items.push({lane:Math.floor(Math.random()*3),y:-45,type:types[Math.floor(Math.random()*types.length)],hit:false});}
function escapeFrame(now){if(!escape.running)return;var c=document.getElementById('escapeCanvas'),x=c.getContext('2d'),dt=Math.min(.035,(now-escape.last)/1000||0);escape.last=now;escape.elapsed+=dt;escape.frame++;escape.speed=190+Math.min(270,escape.elapsed*4.5);escape.score=Math.floor(escape.elapsed*10)+escape.lungs*25;escape.y+=escape.vy*dt;escape.vy+=1100*dt;if(escape.y>=0){escape.y=0;escape.vy=0;escape.jump=0;}escape.slide=Math.max(0,escape.slide-dt);escape.spawn-=dt;if(escape.spawn<=0){spawnEscapeItem();escape.spawn=Math.max(.4,1.05-escape.elapsed*.009)+Math.random()*.2;}
var W=c.width,H=c.height,g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#153d52');g.addColorStop(.55,'#0d3544');g.addColorStop(1,'#061b28');x.fillStyle=g;x.fillRect(0,0,W,H);for(var q=0;q<22;q++){x.fillStyle='rgba(150,240,221,.15)';x.beginPath();x.arc((q*71+escape.frame*.25)%W,(q*113+escape.frame*.7)%H,1+q%3,0,7);x.fill();}

var lanes=[W*.27,W*.5,W*.73],py=H-84+escape.y;escape.items.forEach(function(it){it.y+=escape.speed*dt;var xx=lanes[it.lane],ps=Math.max(.35,Math.min(1.5,.45+it.y/500)),sz=26*ps;x.save();x.translate(xx,it.y);x.scale(ps,ps);if(it.type==='cig'){x.fillStyle='#eee7d8';x.fillRect(-18,-6,30,12);x.fillStyle='#ff805d';x.fillRect(12,-6,6,12);x.font='16px sans-serif';x.fillText('💨',-12,-17);}else if(it.type==='smoke'){x.font='34px sans-serif';x.fillText('💨',-17,12);}else if(it.type==='infected'){x.shadowColor='#ff4d72';x.shadowBlur=16;x.font='30px sans-serif';x.fillText('🦠',-16,10);x.font='22px sans-serif';x.fillText('🫁',-12,-15);}else if(it.type==='lung'){x.shadowColor='#49ffb2';x.shadowBlur=18;x.font='32px sans-serif';x.fillText('🫁',-17,10);x.strokeStyle='#7dffc1';x.beginPath();x.arc(0,0,24,0,7);x.stroke();}else{x.fillStyle='#ff9c65';x.shadowColor='#ff6d51';x.shadowBlur=14;x.beginPath();x.roundRect(-22,-19,44,38,7);x.fill();x.fillStyle='#612d32';x.fillRect(-15,-12,30,5);x.fillRect(-15,2,30,5);x.font='17px sans-serif';x.fillText('⚠️',-9,-24);}x.restore();
if(!it.hit&&Math.abs(it.y-py)<sz+20&&it.lane===escape.lane){if(it.type==='lung'){it.hit=true;escape.lungs++;gameSound('bonus');}else if(it.type==='infected'||it.type==='cig'||it.type==='barrier'){if(escape.y>-25){it.hit=true;escape.over=true;escape.running=false;}}else if(it.type==='smoke'){if(escape.slide>0)it.hit=true;else if(escape.y>-25){it.hit=true;escape.over=true;escape.running=false;}}}});
escape.items=escape.items.filter(function(it){return it.y<H+60&&!it.hit;});x.save();x.translate(lanes[escape.lane],py);if(escape.slide>0)x.scale(1.18,.55);x.shadowColor='#46ffb1';x.shadowBlur=22;x.fillStyle='#39e9a1';x.beginPath();x.ellipse(0,8,17,23,0,0,7);x.fill();x.shadowBlur=0;x.fillStyle='#073b36';x.beginPath();x.arc(0,-17,13,0,7);x.fill();x.fillStyle='#e6fff5';x.beginPath();x.arc(-4,-19,2,0,7);x.arc(4,-19,2,0,7);x.fill();x.strokeStyle='#eafff5';x.lineWidth=3;x.beginPath();x.moveTo(-7,27);x.lineTo(-12,35);x.moveTo(7,27);x.lineTo(12,35);x.stroke();x.restore();

else if(s===2){html+='<div class="top-inline"><button class="topback" data-action="setupBack">‹</button><strong>'+t('personalize')+'</strong></div><div class="setup-progress"><span style="width:50%"></span></div><div class="setup-card"><h2 style="margin:0 0 8px;font-size:21px">'+t('personalize')+'</h2><p class="muted" style="font-size:12px">'+t('personalizeSub')+'</p><div class="field"><label>'+t('usual')+'</label><p class="hint">'+t('usualSub')+'</p><div class="stepper"><button data-action="minus">−</button><strong>'+state.usual+'</strong><button data-action="plus">＋</button></div></div><div class="field"><label for="setupPrice">'+t('defaultPrice')+'</label><input class="input" id="setupPrice" type="number" step=".5" min="0" value="'+esc(state.price)+'"><p class="hint">'+t('priceSub')+'</p></div><button class="action-main fullbtn" data-action="setupNext">'+t('next')+' →</button></div>';}
else{html+='<div class="top-inline"><button class="topback" data-action="setupBack">‹</button><strong>'+t('goalTitle')+'</strong></div><div class="setup-progress"><span style="width:100%"></span></div><div class="setup-card"><h2 style="margin:0 0 5px;font-size:21px">'+t('goalTitle')+'</h2><p class="muted" style="font-size:12px">'+t('goalSub')+'</p>'+[['quit','🌱','goalQuit','goalQuitDesc'],['reduce','📉','goalReduce','goalReduceDesc'],['track','📊','goalTrack','goalTrackDesc']].map(function(g){return '<button class="goal-option '+(state.goal===g[0]?'selected':'')+'" data-goal="'+g[0]+'"><span class="flag">'+g[1]+'</span><span class="choice-copy"><strong>'+t(g[2])+'</strong><small>'+t(g[3])+'</small></span><span class="radio-dot"></span></button>';}).join('')+'<button class="action-main fullbtn" data-action="finishSetup">'+t('finish')+' →</button></div>';}
html+='</main>';app.innerHTML=html;bindEvents();}
function showToast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(function(){el.classList.remove('show');},2400);}
function go(p){page=p;if(p==='add'){formData={at:nowLocalValue(),price:state.price,location:'home',reason:'craving'};}render();window.scrollTo(0,0);}
function bindEvents(){app.querySelectorAll('[data-pop]').forEach(function(b){b.addEventListener('click',function(){popBubble(b);});});app.querySelectorAll('[data-page]').forEach(function(b){b.addEventListener('click',function(){go(b.getAttribute('data-page'));});});app.querySelectorAll('[data-action]').forEach(function(b){b.addEventListener('click',function(){action(b.getAttribute('data-action'),b);});});app.querySelectorAll('[data-lang]').forEach(function(b){b.addEventListener('click',function(){state.lang=b.getAttribute('data-lang');persist();renderSetup();});});app.querySelectorAll('[data-goal]').forEach(function(b){b.addEventListener('click',function(){state.goal=b.getAttribute('data-goal');persist();renderSetup();});});app.querySelectorAll('[data-choice]').forEach(function(b){b.addEventListener('click',function(){formData[b.getAttribute('data-choice')]=b.getAttribute('data-value');render();});});app.querySelectorAll('[data-statstab]').forEach(function(b){b.addEventListener('click',function(){statsTab=b.getAttribute('data-statstab');render();});});app.querySelectorAll('[data-range]').forEach(function(b){b.addEventListener('click',function(){range=Number(b.getAttribute('data-range'));render();});});app.querySelectorAll('[data-delete]').forEach(function(b){b.addEventListener('click',function(){if(confirm(t('deleteConfirm'))){state.logs=state.logs.filter(function(l){return l.id!==b.getAttribute('data-delete');});persist();render();}});});var frm=document.getElementById('smokeForm');if(frm)frm.addEventListener('submit',saveSmoke);var langSelect=document.getElementById('settingLang');if(langSelect)langSelect.addEventListener('change',function(){state.lang=langSelect.value;persist();render();});}
function action(a,el){if(a==='home')return go('home');if(a==='stats')return go('stats');if(a==='tips')return go('tips');if(a==='profile')return go('profile');if(a==='add')return go('add');if(a==='backHome')return go('home');if(a==='setupNext'){if(state.onboardingStep===1){if(!state.lang){state.lang='en';}state.onboardingStep=2;}else if(state.onboardingStep===2){var el=document.getElementById('setupPrice');if(el&&Number(el.value)>=0)state.price=Number(el.value);state.onboardingStep=3;}persist();renderSetup();return;}if(a==='setupBack'){state.onboardingStep=Math.max(1,(state.onboardingStep||1)-1);persist();renderSetup();return;}if(a==='minus'){state.usual=Math.max(0,Number(state.usual)-1);persist();renderSetup();return;}if(a==='plus'){state.usual=Math.min(100,Number(state.usual)+1);persist();renderSetup();return;}if(a==='finishSetup'){state.setupComplete=true;if(!state.startedAt)state.startedAt=new Date().toISOString();persist();page='home';render();return;}if(a==='saveSettings'){var p=document.getElementById('settingPrice'),u=document.getElementById('settingUsual'),g=document.getElementById('settingGoal'),r=document.getElementById('settingReminders');if(p&&p.value!==''&&Number(p.value)>=0)state.price=Number(p.value);if(u&&u.value!==''&&Number(u.value)>=0)state.usual=Number(u.value);if(g)state.goal=g.value;if(r){state.reminders=r.checked;if(state.reminders&&'Notification' in window&&Notification.permission==='default'){Notification.requestPermission().then(function(){scheduleSmartReminderCheck();});}else{scheduleSmartReminderCheck();}}persist();render();showToast(t('settingsSaved'));return;}if(a==='cloudSignIn'||a==='cloudCreate'){var em=document.getElementById('cloudEmail'),pw=document.getElementById('cloudPassword');if(!em||!pw||!em.value.trim()||pw.value.length<6){showToast(state.lang==='hi'?'सही ईमेल और कम से कम 6 अक्षर का पासवर्ड डालें':'Enter a valid email and a password of at least 6 characters');return;}if(!window.goHealthyCloud||!window.goHealthyCloud.configured){showToast(t('cloudNotReady'));return;}var task=a==='cloudCreate'?window.goHealthyCloud.create(em.value.trim(),pw.value):window.goHealthyCloud.signIn(em.value.trim(),pw.value);task.then(function(){page='profile';render();showToast(t('cloudSyncDone'));}).catch(function(e){showToast((e&&e.message)||'Account error');});return;}if(a==='cloudSignOut'){if(window.goHealthyCloud)window.goHealthyCloud.signOut().then(function(){state.accountEmail='';persist();render();});return;}if(a==='export')return exportCsv();if(a==='deleteAll'){if(confirm(t('deleteConfirm')+'\n'+t('deleteAll')+'?')){localStorage.removeItem(KEY);state=Object.assign({},defaults);page='home';render();showToast(t('dataDeleted'));}return;}if(a==='quickRescue'){cravingActive=true;breathStart=Date.now();page='tips';render();window.scrollTo(0,0);return;}if(a==='games')return go('games');if(a==='gameSoundToggle'){toggleGameSound();return;}if(a==='openGame'){var target=el&&el.getAttribute('data-target');['cravingPopPanel','breatheBeatPanel','escapeSmokePanel'].forEach(function(id){var panel=document.getElementById(id);if(panel)panel.classList.toggle('hidden',id!==target);});if(target==='cravingPopPanel'){stopCravingPop();}if(target==='escapeSmokePanel'){stopEscapeRun();}if(target==='breatheBeatPanel'){breathGameRunning=false;clearInterval(breathGameTimer);breathGameTimer=null;updateBreathGame();}var opened=document.getElementById(target);if(opened){opened.classList.remove('hidden');setTimeout(function(){opened.scrollIntoView({behavior:'smooth',block:'start'});},50);}return;}if(a==='escapeStart'){startEscapeRun();return;}if(a==='escapeLeft'){moveEscape(-1);return;}if(a==='escapeRight'){moveEscape(1);return;}if(a==='escapeJump'){escapeJump();return;}if(a==='escapeSlide'){escapeSlide();return;}if(a==='escapePause'){pauseEscapeRun();return;}if(a==='escapeResume'){resumeEscapeRun();return;}if(a==='gameFullscreen'){toggleGameFullscreen(el&&el.getAttribute('data-target')||'cravingPopPanel');return;}if(a==='cravingPopStart'){startCravingPop();return;}if(a==='cravingPopReset'){stopCravingPop();popGameScore=0;popGameTime=30;var ar=document.getElementById('popArena');if(ar){ar.innerHTML='<div class="pop-overlay"><div class="big">🫧</div><strong>Craving Pop</strong><p>Ready for another quick round?</p><button class="action-main" id="popResetStart">▶ Start game</button></div>';var resetStart=document.getElementById('popResetStart');if(resetStart)resetStart.addEventListener('click',startCravingPop);}var ps=document.getElementById('popScore'),pt=document.getElementById('popTime');if(ps)ps.textContent='0';if(pt)pt.textContent='30';return;}if(a==='breathGameToggle'){breathGameRunning=!breathGameRunning;if(breathGameRunning){if(breathGameElapsed>=60)breathGameElapsed=0;breathGameTimer=setInterval(function(){breathGameElapsed++;if(breathGameElapsed>=60){breathGameElapsed=60;breathGameRunning=false;clearInterval(breathGameTimer);breathGameTimer=null;showToast(state.lang==='hi'?'Challenge complete! Shabash 🌿':'Challenge complete! Well done 🌿');}updateBreathGame();},1000);}else{clearInterval(breathGameTimer);breathGameTimer=null;}updateBreathGame();return;}if(a==='breathGameReset'){breathGameRunning=false;breathGameElapsed=0;clearInterval(breathGameTimer);breathGameTimer=null;updateBreathGame();return;}if(a==='startCraving'){cravingActive=true;breathStart=Date.now();render();return;}if(a==='finishCraving'){cravingActive=false;render();showToast(t('done')+' 🌿');return;}if(a==='breathe'){var el=document.getElementById('breathCircle');if(el){el.innerHTML='<div>'+t('exhale')+'<small>6 seconds</small></div>';setTimeout(function(){if(document.getElementById('breathCircle')){document.getElementById('breathCircle').innerHTML='<div>'+t('inhale')+'<small>4 seconds</small></div>'; }},6000);}return;}}
function saveSmoke(e){e.preventDefault();var at=document.getElementById('logDate').value,price=Number(document.getElementById('logPrice').value);if(!at||!isFinite(price)||price<0){showToast(t('required'));return;}var d=new Date(at);if(isNaN(d)||d.getTime()>Date.now()+60000){showToast(t('required'));return;}state.logs.push({id:String(Date.now())+'-'+Math.random().toString(36).slice(2,8),at:d.toISOString(),price:price,location:formData.location||'home',reason:formData.reason||'craving'});state.logs.sort(function(a,b){return new Date(a.at)-new Date(b.at);});persist();formData={};page='home';render();showToast(t('savedLog'));window.scrollTo(0,0);}
function exportCsv(){var rows=[['date_time','price','location','reason']];sortedLogs().forEach(function(l){rows.push([new Date(l.at).toISOString(),l.price,l.location,l.reason]);});var csv=rows.map(function(row){return row.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(',');}).join('\r\n');var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='go-healthy-records.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);showToast(t('dataExported'));}
window.addEventListener('storage',function(){state=load();render();});
document.addEventListener('keydown',function(e){if(page!=='games'||!escape.running)return;if(['ArrowLeft','a','A'].includes(e.key)){e.preventDefault();moveEscape(-1);}else if(['ArrowRight','d','D'].includes(e.key)){e.preventDefault();moveEscape(1);}else if(['ArrowUp','w','W',' '].includes(e.key)){e.preventDefault();escapeJump();}else if(['ArrowDown','s','S'].includes(e.key)){e.preventDefault();escapeSlide();}});document.addEventListener('touchstart',function(e){if(page!=='games'||!escape.running)return;var c=document.getElementById('escapeCanvas');if(c&&c.contains(e.target))escape.swipe={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});document.addEventListener('touchend',function(e){if(!escape.swipe||page!=='games')return;var dx=e.changedTouches[0].clientX-escape.swipe.x,dy=e.changedTouches[0].clientY-escape.swipe.y;if(Math.max(Math.abs(dx),Math.abs(dy))>24){if(Math.abs(dx)>Math.abs(dy))moveEscape(dx>0?1:-1);else if(dy<0)escapeJump();else escapeSlide();}escape.swipe=null;},{passive:true});document.addEventListener('visibilitychange',function(){if(!document.hidden&&page==='tips'&&cravingActive)render();if(!document.hidden)scheduleSmartReminderCheck();});
function scheduleSmartReminderCheck(){if(!state.reminders||!('Notification' in window)||Notification.permission!=='granted')return;var now=new Date(),hour=commonSmokingHour(),key='goHealthy.reminder.'+now.toISOString().slice(0,10)+'.'+hour;if(now.getHours()!==hour||localStorage.getItem(key)==='sent')return;var last=state.logs.reduce(function(m,l){return Math.max(m,new Date(l.at).getTime());},0);if(Date.now()-last<2*60*60*1000)return;try{new Notification(state.lang==='hi'?'Go Healthy — एक छोटा विराम':'Go Healthy — take a small pause',{body:state.lang==='hi'?'यह आपका आम smoking समय है। 5 मिनट रुकें, पानी पिएँ और तलब को गुजरने दें।':'This is a common smoking time for you. Pause for 5 minutes, drink water, and let the craving pass.',tag:'go-healthy-smart-reminder'});localStorage.setItem(key,'sent');}catch(e){console.warn('Notification unavailable',e);}}
window.goHealthyCloud=(function(){var cfg=window.GO_HEALTHY_FIREBASE_CONFIG||{};var configured=!!(cfg.apiKey&&cfg.authDomain&&cfg.projectId&&cfg.appId&&cfg.apiKey!=='YOUR_API_KEY');var auth=null,db=null,user=null;try{if(configured&&window.firebase){if(!firebase.apps.length)firebase.initializeApp(cfg);auth=firebase.auth();db=firebase.firestore();}}catch(e){console.warn('Firebase setup error',e);configured=false;}function sync(data){if(!user||!db)return Promise.resolve();return db.collection('users').doc(user.uid).collection('private').doc('appData').set({state:data,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});}function signIn(email,password){if(!configured)return Promise.reject(new Error(t('cloudNotReady')));return auth.signInWithEmailAndPassword(email,password).then(function(c){user=c.user;api.user=user;return pull(user);});}function pull(u){user=u;return db.collection('users').doc(u.uid).collection('private').doc('appData').get().then(function(doc){if(doc.exists&&doc.data()&&doc.data().state){state=Object.assign({},defaults,doc.data().state);localStorage.setItem(KEY,JSON.stringify(state));}else{return sync(state);}state.accountEmail=u.email||'';localStorage.setItem(KEY,JSON.stringify(state));page='profile';render();});}var api={configured:configured,user:null,sync:sync,signIn:signIn,create:function(email,password){if(!configured)return Promise.reject(new Error(t('cloudNotReady')));return auth.createUserWithEmailAndPassword(email,password).then(function(c){user=c.user;api.user=user;state.accountEmail=user.email||'';return sync(state).then(function(){page='profile';render();});});},signOut:function(){return auth?auth.signOut().then(function(){user=null;api.user=null;}):Promise.resolve();}};if(auth)auth.onAuthStateChanged(function(u){user=u;api.user=u;if(u){state.accountEmail=u.email||'';db.collection('users').doc(u.uid).collection('private').doc('appData').get().then(function(doc){if(doc.exists&&doc.data().state){state=Object.assign({},defaults,doc.data().state);localStorage.setItem(KEY,JSON.stringify(state));}else{sync(state);}render();}).catch(function(e){console.warn('Cloud restore failed',e);});}else if(page==='profile'){render();}});return api;})();
setInterval(scheduleSmartReminderCheck,60000);
render();
})();
